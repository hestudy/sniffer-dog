                        "accent": "#B400FF"

                    fontFamily: {

<style>
        body {
            font-family: 'DM Sans', sans-serif;
            background-color: #000; /* Simulated underlying page */
            margin: 0;
            overflow: hidden;
        }
        
        .glass-panel {
            background: rgba(5, 9, 20, 0.7);
            backdrop-filter: blur(40px);
            -webkit-backdrop-filter: blur(40px);
            border-top: 1px solid rgba(255, 255, 255, 0.1);
        }

        .shimmer {
            background: linear-gradient(90deg, rgba(255,255,255,0.02) 25%, rgba(255,255,255,0.05) 50%, rgba(255,255,255,0.02) 75%);
            background-size: 200% 100%;
            animation: shimmer 1.5s infinite linear;
        }

        @keyframes shimmer {
            0% { background-position: 200% 0; }
            100% { background-position: -200% 0; }
        }

        .pulse-slow {
            animation: pulse 3s cubic-bezier(0.4, 0, 0.6, 1) infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; transform: scale(1); }
            50% { opacity: .7; transform: scale(1.05); }
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>

<body class="text-text-main h-screen w-full relative flex flex-col justify-end">

</div>
<!-- Screen Content: Resource Drawer -->

<!-- Drag Handle -->
<div class="w-full pt-3 pb-5 flex justify-center cursor-pointer" onclick="document.getElementById('drawer').style.transform = 'translateY(100%)'">
<div class="w-12 h-1.5 rounded-full bg-white/20"></div>
</div>
<!-- Tab Bar (From Shared Components) -->
<div class="px-6 border-b border-border-subtle flex gap-8">
<button class="flex-1 flex flex-col items-center justify-center border-b-[3px] border-primary pb-3 pt-2 text-primary font-display font-bold text-[15px] tracking-tight transition-colors">
                Images

<button class="flex-1 flex flex-col items-center justify-center border-b-[3px] border-transparent pb-3 pt-2 text-muted font-display font-bold text-[15px] tracking-tight hover:text-text-main transition-colors">
                Audio
            </button>
<button class="flex-1 flex flex-col items-center justify-center border-b-[3px] border-transparent pb-3 pt-2 text-muted font-display font-bold text-[15px] tracking-tight hover:text-text-main transition-colors">

<!-- Resource List -->
<div class="flex-1 overflow-y-auto px-4 py-4 space-y-3 pb-12">
<!-- Media Card 1 (Image) -->
<div class="h-[80px] bg-surface rounded-DEFAULT flex items-center p-2 pr-4 border border-white/5 active:scale-[0.98] transition-transform cursor-pointer group">
<div class="w-16 h-16 rounded-[12px] bg-background-dark overflow-hidden flex-shrink-0 relative">
<img class="w-full h-full object-cover" data-alt="Abstract liquid neon waves in cyan and purple on a dark background, highly detailed digital art." src="https://lh3.googleusercontent.com/aida-public/AB6AXuDnSM9wzNzK-Uq9jeUg56bDiqF6bimRaY26i9slhq2JOs4-eibrZCRdurVY8QdXrMfOCSLPoNaxLU_dWU3blpEMN9ueHEMWhXXy4RbmA9KPQGfmF4shuJKA6OQR-4bghkpRzS5RIt5w-lTfgfDyPk_HHo8fdlnzaL505ZiuOCrzY5iReeR9bDDIT1udz0-CNSP1yNTwfjBbYelZEXIvk7NiRMTSTU9_Sitn9AfHuECbXYr27ZwJQTsURg"/>
</div>
<div class="ml-4 flex-1 min-w-0 flex flex-col justify-center">
<h4 class="font-display font-semibold text-[15px] text-text-main truncate">hero-bg-fluid-mesh.webp</h4>
<div class="flex items-center gap-2 mt-0.5">
<span class="font-mono text-[12px] text-muted">1.2 MB</span>
<span class="w-1 h-1 rounded-full bg-white/20"></span>
<span class="font-mono text-[12px] text-muted">1920x1080</span>

</div>
<button class="w-10 h-10 rounded-full flex items-center justify-center text-muted group-hover:text-primary transition-colors focus:outline-none focus:ring-2 focus:ring-primary/50">

<!-- Media Card 2 (Image) -->
<div class="h-[80px] bg-surface rounded-DEFAULT flex items-center p-2 pr-4 border border-white/5 active:scale-[0.98] transition-transform cursor-pointer group">
<div class="w-16 h-16 rounded-[12px] bg-background-dark overflow-hidden flex-shrink-0 relative flex items-center justify-center border border-white/10">

<div class="ml-4 flex-1 min-w-0 flex flex-col justify-center">
<h4 class="font-display font-semibold text-[15px] text-text-main truncate">logo-mark-white.png</h4>
<div class="flex items-center gap-2 mt-0.5">
<span class="font-mono text-[12px] text-muted">45 KB</span>
<span class="w-1 h-1 rounded-full bg-white/20"></span>
<span class="font-mono text-[12px] text-muted">256x256</span>

<button class="w-10 h-10 rounded-full flex items-center justify-center text-muted group-hover:text-primary transition-colors focus:outline-none focus:ring-2 focus:ring-primary/50">
<span class="material-symbols-outlined text-[20px]" data-icon="content_copy">content_copy</span>
</button>

<!-- Loading State Ghost Card -->
<div class="h-[80px] bg-surface rounded-DEFAULT flex items-center p-2 pr-4 border border-white/5">
<div class="w-16 h-16 rounded-[12px] shimmer flex-shrink-0"></div>
<div class="ml-4 flex-1 flex flex-col justify-center gap-2">
<div class="h-4 w-3/4 rounded-sm shimmer"></div>
<div class="h-3 w-1/3 rounded-sm shimmer"></div>
</div>

<!-- Empty State (Demonstration - hidden by default, shown here for completeness of PRD) -->
<div class="hidden flex-col items-center justify-center h-48 mt-8 text-center">
<div class="w-16 h-16 rounded-full bg-primary/10 flex items-center justify-center mb-4 pulse-slow">
<span class="material-symbols-outlined text-primary text-[32px]" data-icon="radar">radar</span>
</div>
<p class="font-display text-muted text-[16px]">No assets detected yet.</p>
</div>
</div>
</div>
<script>
        // Simple script to handle tab switching visual logic
        const tabs = document.querySelectorAll('.border-b-\\[3px\\]');
        tabs.forEach(tab => {
            tab.addEventListener('click', () => {
                // Reset all
                tabs.forEach(t => {
                    t.classList.remove('border-primary', 'text-primary');
                    t.classList.add('border-transparent', 'text-muted');
                });
                // Set active
                tab.classList.remove('border-transparent', 'text-muted');
                tab.classList.add('border-primary', 'text-primary');
            });
        });

        // Copy button interaction
        const copyBtns = document.querySelectorAll('.material-symbols-outlined[data-icon="content_copy"]');
        copyBtns.forEach(btn => {
            btn.parentElement.addEventListener('click', (e) => {
                e.stopPropagation(); // Prevent card click
                const originalText = btn.textContent;
                btn.textContent = 'check';
                btn.parentElement.classList.add('text-[#10B981]');
                btn.parentElement.classList.remove('text-muted', 'group-hover:text-primary');
                
                setTimeout(() => {
                    btn.textContent = originalText;
                    btn.parentElement.classList.remove('text-[#10B981]');
                    btn.parentElement.classList.add('text-muted', 'group-hover:text-primary');
                }, 1500);
            });
        });
    </script>
</body></html>
