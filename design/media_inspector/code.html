<!DOCTYPE html>

<html class="dark" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Resource Sniffer - Media Inspector</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;600;700&amp;family=DM+Sans:wght@400;500&amp;family=JetBrains+Mono:wght@400&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "primary": "#0ddbf2",
                        "background-light": "#f5f8f8",
                        "background-dark": "#102022",
                        "abyssal-blue": "#050914",
                        "starlight": "#F8FAFC",
                        "slate-muted": "#64748B",
                        "liquid-purple": "#B400FF",
                        "success-green": "#10B981"
                    },
                    fontFamily: {
                        "display": ["Space Grotesk", "sans-serif"],
                        "body": ["DM Sans", "sans-serif"],
                        "mono": ["JetBrains Mono", "monospace"]
                    },
                    borderRadius: {
                        "DEFAULT": "0.5rem",
                        "lg": "1rem",
                        "xl": "1.5rem",
                        "full": "9999px"
                    },
                    boxShadow: {
                        'neon-glow': '0 8px 32px rgba(13, 219, 242, 0.1)',
                        'neon-glow-active': '0 0 20px rgba(13, 219, 242, 0.4)',
                    }
                },
            },
        }
    </script>
<style>
        body {
            background-color: theme('colors.abyssal-blue');
            color: theme('colors.starlight');
        }
        
        .glass-panel {
            background: rgba(255, 255, 255, 0.04);
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
            border: 1px solid rgba(255, 255, 255, 0.08);
        }

        .glass-button-outline {
            background: rgba(255, 255, 255, 0.04);
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
            border: 1px solid theme('colors.primary');
            color: theme('colors.primary');
        }
        
        /* Subtle fluid animation background layer */
        .ambient-bg {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: -1;
            overflow: hidden;
            background: #050914;
        }
        .ambient-blob {
            position: absolute;
            filter: blur(80px);
            opacity: 0.15;
            animation: float 20s infinite alternate ease-in-out;
        }
        .blob-1 { top: -10%; left: -10%; width: 50vw; height: 50vw; background: #0ddbf2; }
        .blob-2 { bottom: -20%; right: -10%; width: 60vw; height: 60vw; background: #B400FF; animation-delay: -10s; }
        
        @keyframes float {
            0% { transform: translate(0, 0) rotate(0deg) scale(1); }
            100% { transform: translate(10vw, 10vh) rotate(45deg) scale(1.2); }
        }

        /* Success state transition */
        .copy-btn {
            transition: all 0.3s ease;
        }
        .copy-btn.success {
            background-color: theme('colors.success-green') !important;
            border-color: theme('colors.success-green') !important;
            color: theme('colors.abyssal-blue') !important;
            box-shadow: 0 0 20px rgba(16, 185, 129, 0.4) !important;
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="antialiased h-screen w-screen overflow-hidden flex flex-col font-body">
<!-- Ambient Background -->
<div class="ambient-bg">
<div class="ambient-blob blob-1"></div>
<div class="ambient-blob blob-2"></div>
</div>
<!-- Main Modal Container -->
<div class="relative flex flex-col h-full w-full z-10 p-4 pb-8 backdrop-blur-md bg-abyssal-blue/40">
<!-- Header / Dismiss -->
<header class="flex items-center justify-between shrink-0 mb-4 pt-2">
<button aria-label="Close Inspector" class="size-12 flex items-center justify-center rounded-full glass-panel text-starlight hover:bg-white/10 transition-colors">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 0;">close</span>
</button>
<h1 class="font-display font-bold text-lg tracking-tight truncate flex-1 text-center px-4">
                hero-background-v2.mp4
            </h1>
<div class="size-12"></div> <!-- Spacer for centering -->
</header>
<!-- Media Preview Area (Top 60%) -->
<div class="flex-1 min-h-0 w-full mb-6 rounded-[24px] overflow-hidden glass-panel relative flex items-center justify-center shadow-neon-glow">
<!-- Simulated Video Preview -->
<div class="absolute inset-0 w-full h-full bg-black/50 flex flex-col items-center justify-center">
<span class="material-symbols-outlined text-6xl text-primary/80 mb-4" style="font-variation-settings: 'FILL' 0;">play_circle</span>
<p class="font-mono text-xs text-slate-muted">Video Preview</p>
</div>
<img alt="Media Preview" class="w-full h-full object-cover opacity-60 mix-blend-screen" data-alt="A dark, abstract digital fluid simulation with neon cyan and liquid purple swirls, highly detailed, 4k resolution, capturing a modern tech aesthetic." src="https://lh3.googleusercontent.com/aida-public/AB6AXuCeodMPHy5cMvPB0nDmHRsGtw6p5ge40XgCneucJk5Hej0pwzSgQEw9KT42Eswtc94nIhqQy0noBHTMDx3RDjdN8vj93_zYY1gcRUfLvnP01wejr_PkJk1fa165W9c3TvP_ntWBulRQ3qORjwMPQZrzs8AWEEnMoUGi_UUfJex_x_VZeSdafTrph2K-5HBs0sd0UQIykQa0x96ATXApVtODJlF6vhX27hC1Xxa-E3FJB36mfypm9Y69oQ"/>
</div>
<!-- Metadata & Actions Area (Bottom 40%) -->
<div class="shrink-0 flex flex-col gap-4">
<!-- Metadata Card -->
<div class="glass-panel rounded-xl p-4 flex flex-col gap-3">
<div class="flex justify-between items-start border-b border-white/5 pb-2">
<div>
<p class="text-xs text-slate-muted uppercase tracking-wider font-semibold mb-1">Raw Source</p>
<p class="font-mono text-[11px] text-starlight/90 break-all leading-relaxed">
                            https://assets.example.com/media/hero-background-v2.mp4?token=abc123xyz
                        </p>
</div>
</div>
<div class="grid grid-cols-2 gap-4">
<div>
<p class="text-xs text-slate-muted uppercase tracking-wider font-semibold mb-1">Size</p>
<p class="font-mono text-sm text-primary">14.2 MB</p>
</div>
<div>
<p class="text-xs text-slate-muted uppercase tracking-wider font-semibold mb-1">Type</p>
<p class="font-mono text-sm text-starlight">video/mp4</p>
</div>
</div>
</div>
<!-- Action Buttons -->
<div class="flex flex-col gap-3 mt-2">
<button class="copy-btn w-full h-[56px] bg-primary text-abyssal-blue font-display font-semibold text-[15px] rounded-[24px] flex items-center justify-center gap-2 shadow-neon-glow hover:shadow-neon-glow-active" onclick="handleCopy(this, 'URL Copied!')">
<span class="material-symbols-outlined text-[20px]" style="font-variation-settings: 'FILL' 1;">link</span>
<span class="btn-text">Copy Raw URL</span>
</button>
<button class="copy-btn w-full h-[56px] glass-button-outline font-display font-semibold text-[15px] rounded-[24px] flex items-center justify-center gap-2 hover:bg-primary/10" onclick="handleCopy(this, 'cURL Copied!')">
<span class="material-symbols-outlined text-[20px]">terminal</span>
<span class="btn-text">Copy cURL Command</span>
</button>
</div>
</div>
</div>
<script>
        function handleCopy(button, successText) {
            const originalText = button.querySelector('.btn-text').innerText;
            const originalIcon = button.querySelector('.material-symbols-outlined').innerText;
            
            // Haptic feedback if available
            if (navigator.vibrate) {
                navigator.vibrate(50);
            }

            // Apply success state
            button.classList.add('success');
            button.querySelector('.btn-text').innerText = successText;
            button.querySelector('.material-symbols-outlined').innerText = 'check';

            // Revert after 2 seconds
            setTimeout(() => {
                button.classList.remove('success');
                button.querySelector('.btn-text').innerText = originalText;
                button.querySelector('.material-symbols-outlined').innerText = originalIcon;
            }, 2000);
        }
    </script>
</body></html>
